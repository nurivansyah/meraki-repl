services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meraki-twin
    restart: unless-stopped
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - LOG_LEVEL=info
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS:-http://host.docker.internal:9200}
      - ES_USERNAME=${ES_USERNAME:-elastic}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - MERAKI_ORG_ID=${MERAKI_ORG_ID:-}
      - NEO4J_URI=${NEO4J_URI:-bolt://host.docker.internal:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - NETBOX_URL=${NETBOX_URL:-http://host.docker.internal:8000}
      - NETBOX_TOKEN=${NETBOX_TOKEN:-}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=twin
      - PG_USER=twin
      - PG_PASSWORD=changeme
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY_HOURS=720
      - BOOTSTRAP_TOKEN=${BOOTSTRAP_TOKEN:-}
      - SESSION_SECRET=${SESSION_SECRET:-dev-session-secret}
      - SESSION_IDLE_HOURS=8
      - SETUP_ENABLED=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  postgres:
    image: postgres:18-alpine
    container_name: meraki-twin-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=twin
      - POSTGRES_USER=twin
      - POSTGRES_PASSWORD=changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: